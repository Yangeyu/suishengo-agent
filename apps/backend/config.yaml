# 百炼默认使用北京接口，只需 DASHSCOPE_API_KEY；DASHSCOPE_BASE_URL 可覆盖地址。
# 仅管理会话时设为 model: false；production 必须启用模型。
model:
  provider: dashscope
  modelId: deepseek-v4.1-flash
  maxOutputTokens: 4096

context:
  compaction:
    version: summary-v1
    triggerFraction: 0.7
    keepRecentTurns: 2
    maxSummaryTokens: 1024

runtime:
  concurrency:
    global: 8
    perUser: 2
  timeoutMs: 120000
  limits:
    maxSteps: 8
    maxToolCalls: 12
    maxTokens: 32000

tools:
  mcp: false

prompts:
  bindings: {}
  cacheTtlSeconds: 60
