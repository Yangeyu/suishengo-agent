name: suishengo-agent
services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to a released image digest or tag}
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4400
    ports:
      - "127.0.0.1:${HTTP_PORT:-4400}:4400"
    stop_grace_period: 35s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4400/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
